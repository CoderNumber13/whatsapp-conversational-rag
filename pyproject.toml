[project]
name = "conversation-memory"
version = "0.1.0"
description = "Privacy-first conversational memory engine over WhatsApp chat exports (RAG)."
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
